# Backend Principal - render.yaml (usando Docker)
services:
  - type: web
    name: chat-backend-main
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./database.db
      - key: PORT
        value: "8000"
